name: M5CMate
options:
  bundleIdPrefix: com.m5cmate
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true

packages:
  CocoaMQTT:
    url: https://github.com/emqx/CocoaMQTT.git
    exactVersion: 2.1.1

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: false

targets:
  M5CMate:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m5cmate.app
    sources:
      - App/Sources
      - App/Resources
      - Shared
    dependencies:
      - package: CocoaMQTT
      - target: M5CWidget
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: M5C Mate
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.m5cmate.app.refresh
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets: []

  M5CWidget:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m5cmate.app.widget
    sources:
      - Widget/Sources
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: M5C Mate Widget
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  M5CMate:
    build:
      targets:
        M5CMate: all
    run:
      config: Debug
